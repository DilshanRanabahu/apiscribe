[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apiscribe"
version = "0.1.0"
description = "Generate an OpenAPI 3 spec from a HAR network recording."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "openapi-spec-validator>=0.7",
]

[project.scripts]
apiscribe = "apiscribe.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/apiscribe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
